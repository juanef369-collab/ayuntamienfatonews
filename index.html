<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyuntamienFatoNews - El Diario de la Planta 3</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3665/3665922.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --news-green: #5a8a6a;
      --news-dark: #1a1a1a;
      --news-bg: #fdfdfb;
      --accent-red: #cc0000;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--news-bg); 
      color: var(--news-dark); 
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }
    
    .newspaper-font { font-family: 'Playfair Display', serif; }
    
    .header-rule {
      border-top: 3px solid var(--news-dark);
      border-bottom: 1px solid var(--news-dark);
      margin: 1rem 0;
    }
    
    .double-rule {
      border-top: 4px double var(--news-dark);
      margin: 2rem 0;
    }

    .title-green {
      color: var(--news-green);
    }

    .sello-municipal {
      position: absolute;
      width: 90px;
      height: 90px;
      border: 1px solid var(--news-green);
      border-radius: 50%;
      color: var(--news-green);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 800;
      font-size: 7px;
      text-transform: uppercase;
      transform: rotate(-12deg);
      z-index: 10;
      pointer-events: none;
      opacity: 0.4;
      mix-blend-mode: multiply;
      background: rgba(255,255,255,0.1);
    }
    .sello-municipal::after {
      content: "DEPARTAMENTO DE FILTRACIONES • PLANTA 3";
      padding: 4px;
      line-height: 1.1;
    }

    .animate-ticker { 
      display: flex;
      width: max-content;
      animation: ticker 45s linear infinite; 
    }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* Estilo de columna de periódico */
    .news-column {
      column-count: 1;
      column-gap: 2rem;
    }
    @media (min-width: 768px) {
      .news-column-2 { column-count: 2; }
    }

    /* Sombras suaves para elementos modernos */
    .modern-shadow {
      box-shadow: 0 4px 20px rgba(0,0,0,0.05);
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      .header-rule { border-color: black !important; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.474.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

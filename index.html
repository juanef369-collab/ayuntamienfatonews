<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyuntamienFatoNews - El Diario de la Planta 3</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3665/3665922.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #fdfcf8; color: #1a1a1a; overflow-x: hidden; }
    .newspaper-font { font-family: 'Playfair Display', serif; }
    
    .office-background { 
      background-color: #fdfcf8;
      background-image: 
        radial-gradient(#e5e7eb 1px, transparent 1px),
        url('https://www.transparenttextures.com/patterns/paper-fibers.png');
      background-size: 40px 40px, auto;
      background-attachment: fixed;
    }
    
    /* Neo-Brutalism v2 */
    .neo-border { 
      border: 4px solid black; 
      box-shadow: 10px 10px 0px 0px rgba(0,0,0,1); 
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .neo-border:hover {
      transform: translate(-4px, -4px);
      box-shadow: 16px 16px 0px 0px rgba(255,0,0,1);
    }
    .neo-border-sm { 
      border: 2px solid black; 
      box-shadow: 5px 5px 0px 0px rgba(0,0,0,1); 
    }
    
    /* Sello Municipal con Efecto Tinta */
    .sello-municipal {
      position: absolute;
      width: 120px;
      height: 120px;
      border: 5px double #cc0000;
      border-radius: 50%;
      color: #cc0000;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 900;
      font-size: 10px;
      text-transform: uppercase;
      transform: rotate(-20deg);
      background: rgba(255,255,255,0.02);
      backdrop-filter: blur(1px);
      z-index: 30;
      pointer-events: none;
      box-shadow: inset 0 0 10px rgba(204,0,0,0.1);
      mix-blend-mode: multiply;
      mask-image: url('https://www.transparenttextures.com/patterns/stardust.png');
    }
    .sello-municipal::after {
      content: "VERIFICADO POR EL AYUNTAMIENTO DE FATONEWS";
      padding: 10px;
      line-height: 1;
    }

    .logo-glow {
      text-shadow: 6px 6px 0px #ff0000;
    }
    
    .ticker-container {
      background: black;
      border-bottom: 4px solid #ff0000;
    }

    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-ticker { 
      display: flex;
      width: max-content;
      animation: ticker 50s linear infinite; 
    }

    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      .office-background { background: none !important; }
      .neo-border { border: 2px solid black !important; box-shadow: none !important; }
      .sello-municipal { border-color: black !important; color: black !important; animation: none !important; }
      @page { margin: 1cm; }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.42.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.474.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body class="office-background">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AyuntamienFatoNews - El Diario de la Planta 3</title>
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3665/3665922.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --news-green: #5a8a6a;
      --news-dark: #2d2d2d;
      --news-bg: #f8f9f7;
    }
    
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: var(--news-bg); 
      color: var(--news-dark); 
      overflow-x: hidden; 
    }
    
    .newspaper-font { font-family: 'Playfair Display', serif; }
    
    .classic-border {
      border: 1px solid #d1d5db;
    }
    
    .header-line {
      border-top: 2px solid var(--news-dark);
      border-bottom: 2px solid var(--news-dark);
    }
    
    .thin-line {
      border-top: 1px solid #333;
    }

    .title-green {
      color: var(--news-green);
    }

    /* Sello Municipal - Versión Refinada */
    .sello-municipal {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 2px solid var(--news-green);
      border-radius: 50%;
      color: var(--news-green);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-weight: 700;
      font-size: 8px;
      text-transform: uppercase;
      transform: rotate(-15deg);
      background: rgba(255,255,255,0.05);
      z-index: 30;
      pointer-events: none;
      opacity: 0.6;
      mix-blend-mode: multiply;
    }
    .sello-municipal::after {
      content: "OFICIAL PLANTA 3 • VERIFICADO";
      padding: 5px;
      line-height: 1.2;
    }

    /* Ticker minimalista */
    .ticker-container {
      background: var(--news-dark);
      color: white;
    }

    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
    .animate-ticker { 
      display: flex;
      width: max-content;
      animation: ticker 60s linear infinite; 
    }

    /* Adaptación para impresión */
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; }
      .classic-border { border: 1px solid black !important; }
      @page { margin: 1.5cm; }
    }
  </style>
<script type="importmap">
{

    "react": "https://esm.sh/react@^19.2.4",

    "@google/genai": "https://esm.sh/@google/genai@^1.42.0",

    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.4"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
